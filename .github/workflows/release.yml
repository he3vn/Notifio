name: Build and Release Notifio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target: --macos
          - os: windows-latest
            label: Windows (experimental)
            target: --windows
    runs-on: ${{ matrix.os }}
    # Windows is experimental: never block the macOS release if it fails.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application
        run: python build.py ${{ matrix.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notifio-${{ runner.os }}
          path: dist/Notifio-*.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release_dist
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release_dist/ \;
          ls -la release_dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true
          body: |
            > **Windows build is experimental.** It is built automatically but has not
            > been tested on real Windows hardware yet. Please report any issues.
